<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token Sale Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f6f7f9;
      color: #111;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .results {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    .section-title {
      margin-top: 24px;
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: 700;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 10px 0;
    }

    .result-row strong {
      font-weight: 700;
      text-align: right;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Token Sale Calculator</h1>

    <p>
      Estimate allocation, ROI, TGE value and target FDVs for a token sale.
    </p>

    <div class="field">
      <label for="investment">Investment ($)</label>
      <input
        id="investment"
        type="number"
        value="1000"
        min="0"
        step="100"
      />
    </div>

    <div class="field">
      <label for="oversubscription">Oversubscription (x)</label>
      <input
        id="oversubscription"
        type="number"
        value="1"
        min="1"
        step="0.1"
      />
    </div>

    <div class="field">
      <label for="saleFdv">Sale FDV ($)</label>
      <input
        id="saleFdv"
        type="number"
        value="40000000"
        min="1"
        step="1000000"
      />
    </div>

    <div class="field">
      <label for="expectedFdv">Expected FDV ($)</label>
      <input
        id="expectedFdv"
        type="number"
        value="100000000"
        min="1"
        step="1000000"
      />
    </div>

    <div class="field">
      <label for="tgeUnlock">TGE Unlock (%)</label>
      <input
        id="tgeUnlock"
        type="number"
        value="25"
        min="0"
        max="100"
        step="1"
      />
    </div>

    <button onclick="calculate()">Calculate</button>

    <div class="results">
      <div class="result-row">
        <span>Estimated Allocation</span>
        <strong id="allocation">-</strong>
      </div>

      <div class="result-row">
        <span>Expected Multiple</span>
        <strong id="multiple">-</strong>
      </div>

      <div class="result-row">
        <span>Position Value</span>
        <strong id="positionValue">-</strong>
      </div>

      <div class="result-row">
        <span>Profit</span>
        <strong id="profit">-</strong>
      </div>

      <div class="result-row">
        <span>TGE Value</span>
        <strong id="tgeValue">-</strong>
      </div>

      <div class="result-row">
        <span>Locked Value</span>
        <strong id="lockedValue">-</strong>
      </div>

      <div class="section-title">Target FDVs</div>

      <div class="result-row">
        <span>Break-even FDV</span>
        <strong id="breakEvenFdv">-</strong>
      </div>

      <div class="result-row">
        <span>FDV for 2x</span>
        <strong id="twoXFdv">-</strong>
      </div>

      <div class="result-row">
        <span>FDV for 3x</span>
        <strong id="threeXFdv">-</strong>
      </div>
    </div>
  </div>

  <script>
    function formatUsd(value) {
      return "$" + value.toLocaleString(undefined, {
        maximumFractionDigits: 2
      });
    }

    function calculate() {
      const investment = Number(
        document.getElementById("investment").value
      );

      const oversubscription = Number(
        document.getElementById("oversubscription").value
      );

      const saleFdv = Number(
        document.getElementById("saleFdv").value
      );

      const expectedFdv = Number(
        document.getElementById("expectedFdv").value
      );

      const tgeUnlock = Number(
        document.getElementById("tgeUnlock").value
      );

      if (
        investment <= 0 ||
        oversubscription < 1 ||
        saleFdv <= 0 ||
        expectedFdv <= 0 ||
        tgeUnlock < 0 ||
        tgeUnlock > 100
      ) {
        alert("Please enter valid values.");
        return;
      }

      const allocation = investment / oversubscription;

      const multiple = expectedFdv / saleFdv;

      const positionValue = allocation * multiple;

      const profit = positionValue - allocation;

      const tgeValue = positionValue * (tgeUnlock / 100);

      const lockedValue = positionValue - tgeValue;

      const breakEvenFdv = saleFdv;
      const twoXFdv = saleFdv * 2;
      const threeXFdv = saleFdv * 3;

      document.getElementById("allocation").textContent =
        formatUsd(allocation);

      document.getElementById("multiple").textContent =
        multiple.toFixed(2) + "x";

      document.getElementById("positionValue").textContent =
        formatUsd(positionValue);

      document.getElementById("profit").textContent =
        formatUsd(profit);

      document.getElementById("tgeValue").textContent =
        formatUsd(tgeValue);

      document.getElementById("lockedValue").textContent =
        formatUsd(lockedValue);

      document.getElementById("breakEvenFdv").textContent =
        formatUsd(breakEvenFdv);

      document.getElementById("twoXFdv").textContent =
        formatUsd(twoXFdv);

      document.getElementById("threeXFdv").textContent =
        formatUsd(threeXFdv);
    }

    calculate();
  </script>
</body>
</html>
